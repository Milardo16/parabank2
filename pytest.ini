[pytest]
testpaths = tests
addopts = -v --alluredir=reports/allure-results --clean-alluredir
markers =
    smoke: быстрые проверки основного сценария
    positive: позитивные сценарии регистрации
    negative: негативные сценарии регистрации
    security: проверки безопасности формы регистрации
    metrics: тесты, собирающие метрики производительности
    regression: расширенные сценарии (новые требования)
log_cli = false
